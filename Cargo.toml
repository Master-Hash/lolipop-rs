[package]
name = "lolipop-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2.179"
windows = { version = "0.62.2", features = [
  "Foundation_Numerics",
  "Graphics",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Win32_System_WinRT_Graphics_Direct2D",
  "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3.1"

[build-dependencies]
bindgen = "0.72.1"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
